<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll('.page-inner a[href^="http"]').forEach(function (link) {
      link.setAttribute("target", "_blank");
      link.setAttribute("rel", "noopener noreferrer");
    });

    document.querySelectorAll("div.sourceCode, pre.sourceCode").forEach(function (block) {
      if (block.closest("details.code-fold")) {
        return;
      }

      const details = document.createElement("details");
      details.className = "code-fold";

      const summary = document.createElement("summary");
      summary.textContent = "Code";

      block.parentNode.insertBefore(details, block);
      details.appendChild(summary);
      details.appendChild(block);
    });
  });
</script>
