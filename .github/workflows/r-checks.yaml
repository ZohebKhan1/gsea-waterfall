name: R checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: install.packages(c("ggplot2", "ggrepel", "lintr", "RColorBrewer", "scales"))
        shell: Rscript {0}

      - name: Parse maintained R files
        run: |
          files <- list.files(c("R", "functions"), "[.]R$", full.names = TRUE)
          invisible(lapply(files, parse))
        shell: Rscript {0}

      - name: Lint maintained R files
        run: lintr::lint_dir(".")
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
